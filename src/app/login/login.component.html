<div class="container">
  <h2>Iniciar sesión</h2>
   <form (ngSubmit)="login()">
    <div class="form-group">
      <label for="username">Usuario</label>
       <input type="text" class="form-control" id="username" placeholder="Introduce tu usuario" [(ngModel)]="username" name="username">
     <div *ngIf="username === ''" class="text-danger">El nombre de usuario es obligatorio</div>
   </div>
   <div class="form-group">
      <label for="password">Contraseña</label>
     <input type="password" class="form-control" id="password" placeholder="Introduce tu contraseña" [(ngModel)]="password" name="password">
     <div *ngIf="password === ''" class="text-danger">La contraseña es obligatoria</div>
    </div>
   <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
  </form>
</div>
